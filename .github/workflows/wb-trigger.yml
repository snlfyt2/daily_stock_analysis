name: Trigger WorkBuddy Daily

on:
  schedule:
    # GitHub 自带定时对 Workbuddy 私有仓库失效，改为在本公开仓库定时触发
    - cron: "0 23 * * *"    # 北京时间 07:00
    - cron: "0 4 * * *"     # 北京时间 12:00
    - cron: "30 15 * * *"   # 北京时间 23:30
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch WorkBuddy workflow
        env:
          WB_PAT: ${{ secrets.WB_PAT }}
        run: |
          code=$(curl -s -o /tmp/resp.txt -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $WB_PAT" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/snlfyt2/Workbuddy/actions/workflows/workbuddy.yml/dispatches \
            -d '{"ref":"main"}')
          echo "http_status=$code"
          cat /tmp/resp.txt 2>/dev/null || true
          test "$code" = "204"
